name: kl-oa
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vehicle}
      POSTGRES_USER: ${POSTGRES_USER:-vehicle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    entrypoint: ["/bin/sh", "/etc/prometheus/start.sh"]
    environment:
      PROMETHEUS_TARGET: ${PROMETHEUS_TARGET:-host.docker.internal:9001}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./backend/infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/config.yaml"]
    ports: ["127.0.0.1:${LOKI_PORT:-3100}:3100"]
    volumes:
      - ./backend/infra/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    # Minimal Loki image: config self-check only; use GET /ready for live readiness.
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-config.file=/etc/loki/config.yaml", "-verify-config=true"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.11.0
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./backend/infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${APP_LOG_DIR:-./backend/services/sv_vehicle/logs}:/var/log/sv_vehicle:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/12345; printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3; head -1 <&3 | grep -q '200'"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    volumes:
      - ./backend/infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./backend/infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
