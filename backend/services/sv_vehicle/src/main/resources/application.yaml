server:
  port: ${SERVER_PORT:9001}

spring:
  task:
    execution:
      propagate-context: true
  application:
    name: sv_vehicle
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:vehicle}
    username: ${POSTGRES_USER:vehicle}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

management:
  observations:
    annotations:
      enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  file:
    name: ${APP_LOG_FILE:./logs/sv_vehicle.json}
  structured:
    format:
      console: logstash
      file: logstash
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB

# Never collect SQL bind values or result-set contents.
jdbc:
  includes: CONNECTION,QUERY
  datasource-proxy:
    include-parameter-values: false
    query:
      enable-logging: false
  resultset-operations:
    enabled: false

app:
  tracing:
    span-logs-enabled: ${SPAN_LOGS_ENABLED:true}
